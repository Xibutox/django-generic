# The collected static files. Hashed names - base.3f2a9c1d8e7b.css -
# change with their content: kept for a year. The few files asked for
# by their plain name are kept for an hour.
location /static/ {
    alias /srv/static/;
    access_log off;
    add_header Cache-Control "public, max-age=3600";

    location ~ "\.[0-9a-f]{12}\.[A-Za-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
