# What a django-generic site needs from nginx, whichever server block
# includes it: the site's own (docker/nginx/https.conf.template), or a
# server block in an nginx already serving other applications
# (docker/nginx/host-site.conf.example).
#
# The including server block says where the application is:
#
#     upstream desk_web { server 127.0.0.1:8000; }      # at http level
#     server {
#         set $generic_upstream desk_web;
#         location /static/ { alias /srv/desk/static/; ... }
#         include /etc/nginx/snippets/django-generic.conf;
#     }
#
# $generic_upstream names an upstream block, so several applications
# on one nginx each include this file with their own.

# Imports send spreadsheets of up to IMPORT_MAX_FILE_SIZE (5 MB), forms
# and the wiki's editor files of up to FILE_MAX_SIZE (10 MB): nginx
# refuses anything above 1 MB unless told.
#
# And no location for the uploaded files (MEDIA_ROOT): Django serves
# each one through its record's endpoint, which checks who asks.
client_max_body_size 20m;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json
           image/svg+xml text/plain text/csv;

# The live events: a WebSocket, kept open while the page is. nginx
# closes a connection quiet for 60 seconds by default, which would cut
# every idle page off its updates.
location /ws/ {
    proxy_pass http://$generic_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Replaced, never appended to: what Django reads as the client's
    # address and the scheme is what nginx saw, not what a client sent.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Everything else: the pages and the REST API. Exports of large tables
# take a while; five minutes before nginx gives up on one.
location / {
    proxy_pass http://$generic_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
