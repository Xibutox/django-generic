# GitLab CI for django-generic.
#
# Everything runs in containers on a Docker executor: the linters and
# the suite on plain python images, the suite again against Postgres and
# Redis as services, then the project's own image, built and tried.
#
#   quality      black, isort, flake8, mypy, bandit, message catalogs
#   test         the suite on 3.10 to 3.13 (SQLite), the oldest Django
#                and DRF accepted included; the browser tests, the
#                example driven through Chromium (tests/browser)
#   integration  the same suite against Postgres and Redis
#   package      the wheel built and installed alone in a clean
#                environment, then plugged into a new project
#                (scripts/smoke_install.py); the three images of
#                docker/Dockerfile: the suite run in the dev one,
#                `check --deploy` in the prod one, then the prod and
#                proxy images pushed
#
# The runner needs the Docker executor; `package` also needs a
# privileged runner for docker-in-docker. Without one, keep the first
# three stages: they are the ones that guard the code.

stages:
  - quality
  - test
  - integration
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Both are read by tests/settings.py and example_project/settings/;
  # empty means SQLite and the in-memory channel layer.
  DATABASE_URL: ""
  REDIS_URL: ""

# One pip cache per dependency set, shared by every job of a branch.
.pip-cache: &pip-cache
  key:
    files:
      - pyproject.toml
  paths:
    - .cache/pip

.python:
  image: python:3.12-slim
  cache: *pip-cache
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -e ".[export,events,tasks,postgres,wiki,dev]"

# -- quality ------------------------------------------------------------

lint:
  extends: .python
  stage: quality
  script:
    - black --check .
    - isort --check-only .
    - flake8 generic tests example example_project scripts debug.py
    # Reported, not blocking: django-stubs has not caught up with the
    # Django this runs on, and most of what it says is that.
    - mypy generic || true
    # B101 (assert) is noise where asserts are internal invariants.
    - bandit -r generic -ll --skip B101

# The .mo files are what the running application reads; a .po edited
# without recompiling translates nothing, and nothing says so. The
# suite then checks the catalogs themselves (tests/test_i18n.py).
messages:
  image: python:3.12-slim
  stage: quality
  cache: *pip-cache
  script:
    - python scripts/compile_messages.py --check

# -- test ---------------------------------------------------------------

test:
  extends: .python
  stage: test
  image: python:$PYTHON_VERSION-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
      # The oldest Python, Django and DRF the package accepts.
      - PYTHON_VERSION: "3.10"
        PINS: "Django==5.2.* djangorestframework==3.16.*"
  script:
    - if [ -n "$PINS" ]; then pip install $PINS; fi
    - >-
      pytest
      --cov=generic
      --cov-report=term
      --cov-report=xml
      --cov-fail-under=80
      --junitxml=report.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# The example driven through a real Chromium (tests/browser). Opt-in:
# the jobs above deselect them, and they need the browser extra and
# the browser itself. Screenshots of what failed are kept.
browser:
  image: python:3.12-slim
  stage: test
  cache: *pip-cache
  script:
    - pip install -e ".[export,import,events,tasks,wiki,fsm,api,dev,browser]"
    - python -m playwright install --with-deps chromium
    - >-
      pytest tests/browser -m browser
      --no-cov
      -p no:cacheprovider
      --screenshot only-on-failure
      --output test-results/browser
  artifacts:
    when: on_failure
    paths:
      - test-results/

# -- integration --------------------------------------------------------

integration:
  extends: .python
  stage: integration
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: generic
    POSTGRES_USER: generic
    POSTGRES_PASSWORD: generic
    # The same suite, on the backends production runs: Postgres tells
    # apart what SQLite lets through - icontains on a number, ordering
    # of nulls, a date compared against a timestamp.
    DATABASE_URL: "postgres://generic:generic@postgres:5432/generic"
    REDIS_URL: "redis://redis:6379/0"
  script:
    - pytest -q --no-cov

# -- package ------------------------------------------------------------

# The wheel as a user installs it: built, checked, installed alone in a
# clean environment - nothing of the checkout on the path - and plugged
# into a new project, at the root and under a prefix.
wheel:
  image: python:3.12-slim
  stage: package
  cache: *pip-cache
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    - python -m venv /tmp/core
    - /tmp/core/bin/pip install dist/*.whl
    - cd /tmp && /tmp/core/bin/python "$CI_PROJECT_DIR/scripts/smoke_install.py"
    - cd /tmp && /tmp/core/bin/python "$CI_PROJECT_DIR/scripts/smoke_install.py" --prefix app/
  artifacts:
    paths:
      - dist/

build images:
  stage: package
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    PROXY_IMAGE: "$CI_REGISTRY_IMAGE/proxy:$CI_COMMIT_SHORT_SHA"
  cache: []
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # The development image runs the suite it was built from, or it is
    # not the same application: the wheel of a missing extra shows here.
    - docker build -f docker/Dockerfile --target dev -t generic-dev .
    - docker run --rm generic-dev pytest -q --no-cov -p no:cacheprovider
    # The production image holds no test tools: it is asked what Django
    # thinks of it as a deployment, with production-shaped values.
    - docker build -f docker/Dockerfile --target prod -t "$IMAGE" .
    - >-
      docker run --rm
      -e DJANGO_SECRET_KEY="ci-$CI_COMMIT_SHA-never-used-to-sign-anything"
      -e DJANGO_ALLOWED_HOSTS=desk.example.com
      -e DATABASE_URL=sqlite:////tmp/ci.sqlite3
      -e REDIS_URL=redis://localhost:6379/0
      -e DJANGO_ADMINS=ops@example.com
      "$IMAGE" python manage.py check --deploy --fail-level WARNING
    - docker build -f docker/Dockerfile --target proxy -t "$PROXY_IMAGE" .
    - docker push "$IMAGE"
    - docker push "$PROXY_IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
        docker tag "$PROXY_IMAGE" "$CI_REGISTRY_IMAGE/proxy:latest"
        docker push "$CI_REGISTRY_IMAGE/proxy:latest"
      fi
  rules:
    # Merge requests get the code checked; only the default branch and
    # tags produce an image worth keeping.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
