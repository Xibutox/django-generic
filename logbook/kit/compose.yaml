# The logbook: the site (gunicorn) on port LOGBOOK_PORT (4243), its
# PostgreSQL, and the scheduler that reads the COMET and DES figures
# (sync_kpi) every KPI_SYNC_EVERY seconds. Settings in .env, beside
# this file (copy .env.example).
#
#   docker compose up --build -d
#
# Run in the kit scripts/logbook_kit.py assembles, not in the
# repository: vendor/ and logbook/ are the kit's (README.md).

name: logbook

# Behind a proxy: HTTP_PROXY, HTTPS_PROXY and NO_PROXY in .env, for the
# build (pip) and for sync_kpi.
x-build: &build
  context: .
  args:
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}
    http_proxy: ${HTTP_PROXY:-}
    https_proxy: ${HTTPS_PROXY:-}
    no_proxy: ${NO_PROXY:-}

x-proxy: &proxy
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  # The database is never reached through the proxy.
  NO_PROXY: db,localhost,127.0.0.1${NO_PROXY:+,}${NO_PROXY:-}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: db,localhost,127.0.0.1${NO_PROXY:+,}${NO_PROXY:-}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: logbook
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook -d logbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: *build
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *proxy
      POSTGRES_HOST: db
      POSTGRES_DB: logbook
      POSTGRES_USER: logbook
    ports:
      - "${LOGBOOK_PORT:-4243}:8000"
    volumes:
      # Where the export file is put for the import (README.md).
      - ./import:/import:ro
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: *build
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *proxy
      POSTGRES_HOST: db
      POSTGRES_DB: logbook
      POSTGRES_USER: logbook
    # The site's start migrates; this one only waits for it.
    entrypoint: []
    command: >
      sh -c 'while true; do python manage.py sync_kpi || true;
      sleep "$${KPI_SYNC_EVERY:-3600}"; done'
    depends_on:
      web:
        condition: service_started

volumes:
  postgres-data:
