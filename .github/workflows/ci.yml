name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, catalogs and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[export,events,tasks,wiki,dev]"
      - name: black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: flake8
        run: flake8 generic tests example example_project minimal scripts debug.py
      - name: message catalogs
        # A .po edited without recompiling translates nothing.
        run: python scripts/compile_messages.py --check
      - name: OpenAPI description
        # Every endpoint of the example described, and no guess left:
        # a resource the schema cannot describe fails here.
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: bandit
        # B101 (assert) is noise in a codebase that uses asserts as
        # internal invariants rather than as input validation.
        run: bandit -r generic -ll --skip B101
      - name: mypy
        # Reported, not blocking: django-stubs trails the Django this
        # runs on, and most of what it says is that.
        continue-on-error: true
        run: mypy generic

  test:
    name: Tests (Python ${{ matrix.python-version }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest versions the package accepts...
          - python-version: "3.10"
            django: "5.2.*"
            drf: "3.16.*"
          - python-version: "3.11"
            django: "5.2.*"
            drf: ""
          # ...and the newest.
          - python-version: "3.12"
            django: ""
            drf: ""
          - python-version: "3.13"
            django: ""
            drf: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[export,events,tasks,wiki,dev]"
          if [ -n "${{ matrix.django }}" ]; then pip install "Django==${{ matrix.django }}"; fi
          if [ -n "${{ matrix.drf }}" ]; then pip install "djangorestframework==${{ matrix.drf }}"; fi
          python -c "import django, rest_framework; print('Django', django.get_version(), 'DRF', rest_framework.VERSION)"
      - run: pytest --cov=generic --cov-report=xml --cov-fail-under=80 --junitxml=junit.xml
      - name: Failures as annotations
        # Readable on the run's page by anyone, without opening the log.
        if: failure()
        run: python scripts/ci_annotations.py junit.xml

  integration:
    name: Tests against Postgres and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: generic
          POSTGRES_USER: generic
          POSTGRES_PASSWORD: generic
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://generic:generic@localhost:5432/generic
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[export,events,tasks,postgres,wiki,dev]"
      - run: pytest -q --no-cov --junitxml=junit.xml
      - name: Failures as annotations
        if: failure()
        run: python scripts/ci_annotations.py junit.xml

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[export,import,events,tasks,wiki,fsm,api,dev,browser]"
      - name: Chromium, and what it needs from the system
        run: python -m playwright install --with-deps chromium
      - name: The example, driven through Chromium
        # Opt-in: a plain pytest deselects them (-m "not browser").
        run: pytest tests/browser -m browser --no-cov -p no:cacheprovider --screenshot only-on-failure --output test-results/browser
      - name: Screenshots of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/

  package:
    name: Package, installed as a user installs it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and the source archive
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: The core alone, in a clean environment
        # Nothing from the checkout on the path: whatever the pages
        # need, the wheel must carry.
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist/*.whl
          cd /tmp && /tmp/core/bin/python "$GITHUB_WORKSPACE/scripts/smoke_install.py"
          cd /tmp && /tmp/core/bin/python "$GITHUB_WORKSPACE/scripts/smoke_install.py" --prefix app/
      - name: Every extra, on the oldest Django accepted
        run: |
          python -m venv /tmp/full
          /tmp/full/bin/pip install "$(ls dist/*.whl)[export,import,events,tasks,wiki]" "Django==5.2.*" "djangorestframework==3.16.*" pytest pytest-django
          # --sweep: the project's own PageSweep, from the wheel.
          cd /tmp && /tmp/full/bin/python "$GITHUB_WORKSPACE/scripts/smoke_install.py" --sweep
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  nginx:
    name: The nginx front, configured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compose files, as Compose reads them
        run: |
          printf 'DJANGO_SECRET_KEY=ci\nDJANGO_ALLOWED_HOSTS=desk.example.com\nPOSTGRES_PASSWORD=ci\nSTATIC_EXPORT_DIR=/tmp/static\n' > /tmp/ci.env
          for files in "-f docker/docker-compose.prod.yml" \
                       "-f docker/docker-compose.prod-nginx.yml" \
                       "-f docker/docker-compose.prod-nginx.yml -f docker/docker-compose.host-nginx.yml"; do
            docker compose $files --env-file /tmp/ci.env config -q
          done
      - name: Build the nginx image
        run: docker build -f docker/Dockerfile --target nginx -t generic-nginx .
      - name: A certificate to serve
        run: |
          mkdir -p /tmp/certs/live/desk.example.com
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=desk.example.com" \
            -keyout /tmp/certs/live/desk.example.com/privkey.pem \
            -out /tmp/certs/live/desk.example.com/fullchain.pem
          chmod -R a+r /tmp/certs
      - name: nginx -t, over HTTP and over HTTPS
        # web stands for the application's container, which nginx
        # resolves when it reads its configuration.
        run: |
          docker run --rm --add-host web:127.0.0.1 -e NGINX_MODE=http \
            generic-nginx nginx -t
          docker run --rm --add-host web:127.0.0.1 \
            -v /tmp/certs:/etc/nginx/certs:ro \
            -e NGINX_CERT=/etc/nginx/certs/live/desk.example.com/fullchain.pem \
            -e NGINX_CERT_KEY=/etc/nginx/certs/live/desk.example.com/privkey.pem \
            generic-nginx nginx -t
      - name: HTTPS without a certificate is refused, saying why
        run: |
          ! docker run --rm generic-nginx nginx -t 2> /tmp/refused.txt
          grep -q "no certificate" /tmp/refused.txt
      - name: The server block for an nginx already on the server
        # As an administrator would install it, beside another site.
        run: |
          # A container network may have no IPv6: its lines go, as the
          # file says to on such a server.
          sed '/listen \[::\]/d' docker/nginx/host-site.conf.example > /tmp/desk.conf
          sed 's/desk/crm/g; s/8000/8001/' /tmp/desk.conf > /tmp/crm.conf
          cp -r /tmp/certs/live/desk.example.com /tmp/certs/live/crm.example.com
          docker run --rm \
            -v /tmp/desk.conf:/etc/nginx/conf.d/desk.conf:ro \
            -v /tmp/crm.conf:/etc/nginx/conf.d/crm.conf:ro \
            -v "$PWD/docker/nginx/django-generic.conf:/etc/nginx/snippets/django-generic.conf:ro" \
            -v /tmp/certs:/etc/letsencrypt:ro \
            nginx:stable-alpine sh -c 'rm /etc/nginx/conf.d/default.conf && nginx -t'

  minimal-docker:
    name: The minimal example, in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Built and started as its README says
        run: docker compose -f minimal/compose.yaml up --build -d
      - name: The sign-in page answers, and / and the wiki send there
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8000/login/ && break
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:8000/login/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/wiki/)" = 302
      - name: The container's log
        if: always()
        run: docker compose -f minimal/compose.yaml logs
